# Publishes the feature and release records under delivery/ as a styled site on GitHub Pages.
# Pull requests only build the site, so a broken record fails before it merges.
name: Delivery pages

on:
  push:
    branches: [main]
    paths:
      - "delivery/**"
      - ".claude/skills/delivery-docs/**"
      - ".github/workflows/delivery-pages.yml"
  pull_request:
    paths:
      - "delivery/**"
      - ".claude/skills/delivery-docs/**"
      - ".github/workflows/delivery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the site
        run: node .claude/skills/delivery-docs/scripts/docs.mjs site _site
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
